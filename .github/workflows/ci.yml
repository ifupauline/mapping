# Build the library and the tools, then run every test: unit tests, golden
# results, invariants, round-trip of the input files, the exact solver on a
# small instance, the network simulator and the full-system simulator.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: pip install -r requirements.txt
      - name: Configure
        run: cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.compiler }}
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
